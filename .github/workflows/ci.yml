name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  schedule:
    # Weekly, so the dependency audit still runs when nobody pushes.
    - cron: '0 6 * * 1'

# A new push to the same branch cancels the run that it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '11', '17', '21' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Tests
        run: mvn -B test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        if: matrix.java-version == '17'

  build:
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package

      - name: Javadoc
        run: mvn -B -DskipTests javadoc:javadoc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-package
          path: target/*.jar

  # The examples are compiled against the real SDK API, so a change that breaks them
  # (or breaks the snippets in README.md and docs/) fails the build.
  examples:
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install the SDK locally
        run: mvn -B -DskipTests install

      - name: Compile the examples
        run: mvn -B -f examples/pom.xml compile

  # Deliberately NOT run on pull requests. OWASP dependency-check downloads the whole NVD
  # CVE database, which takes tens of minutes on a cold cache and is rate-limited hard
  # without an NVD_API_KEY. Running it per-PR left the check list pending long after every
  # other job had finished. It runs on pushes to main/develop and weekly instead, so a new
  # CVE is still caught within seven days. Dependabot covers the gap between runs.
  security-audit:
    runs-on: ubuntu-22.04
    needs: test
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Without this cache every run re-downloads the full NVD feed.
      - name: Cache the NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      # Fails the job on any dependency with a CVSS score of 7.0 or higher.
      # Set the NVD_API_KEY repository secret to raise the NVD rate limit.
      - name: OWASP dependency check
        run: >
          mvn -B org.owasp:dependency-check-maven:10.0.3:check
          -DfailBuildOnCVSS=7
          -DassemblyAnalyzerEnabled=false
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  publish-dry-run:
    runs-on: ubuntu-22.04
    needs: [ test, build, examples ]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Builds every artifact Maven Central requires (jar, sources, javadoc) without
      # signing or uploading, so packaging problems surface on the PR rather than at
      # release time.
      - name: Verify release artifacts
        run: mvn -B -Prelease -DskipTests -Dgpg.skip=true package

  # security-audit is intentionally absent from `needs`: it does not run on a release event,
  # and a skipped dependency would skip this job too.
  publish:
    runs-on: ubuntu-22.04
    needs: [ test, build, examples ]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        run: mvn -B -Prelease -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
