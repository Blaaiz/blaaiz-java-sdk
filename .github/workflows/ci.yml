name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

# A new push to the same branch cancels the run that it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '11', '17', '21' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Tests
        run: ./mvnw -B test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        if: matrix.java-version == '17'

  build:
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Javadoc
        run: ./mvnw -B -DskipTests javadoc:javadoc

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-package
          path: target/*.jar

  # The examples are compiled against the real SDK API, so a change that breaks them
  # (or breaks the snippets in README.md and docs/) fails the build.
  examples:
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install the SDK locally
        run: ./mvnw -B -DskipTests install

      - name: Compile the examples
        run: ./mvnw -B -f examples/pom.xml compile

  release-please:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-dry-run:
    runs-on: ubuntu-22.04
    needs: [ test, build, examples ]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # The publishing plugin reads this server entry even when it does not upload.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      # Builds the bundle that publish uploads (jar, sources, javadoc, pom) without
      # signing or uploading it, so packaging problems surface on the PR rather than
      # at release time.
      - name: Build the Maven Central bundle
        run: ./mvnw -B -Prelease -DskipTests -Dgpg.skip=true -DskipPublishing=true deploy
        env:
          MAVEN_CENTRAL_USERNAME: dry-run
          MAVEN_CENTRAL_PASSWORD: dry-run

      # Central rejects the whole bundle for any file that is not an artifact. Maven
      # 3.10 adds maven-metadata-local.xml and _remote.repositories, which broke 1.6.0.
      - name: Check the Maven Central bundle
        run: |
          staging=target/central-staging
          if [ -z "$(find "$staging" -type f -name 'blaaiz-java-sdk-*.pom')" ]; then
            echo "::error::The bundle in $staging has no pom."
            exit 1
          fi
          stray=$(find "$staging" -type f ! -name 'blaaiz-java-sdk-*' ! -name 'central-bundle.zip')
          if [ -n "$stray" ]; then
            echo "::error::Maven Central rejects a bundle with these files:"
            echo "$stray"
            exit 1
          fi

  publish:
    runs-on: ubuntu-22.04
    needs: [ test, build, examples, release-please ]
    # A release that release-please creates with GITHUB_TOKEN does not start a
    # new workflow run, so publish runs in this run when release_created is true.
    # !cancelled() keeps it alive on a manual release event, where release-please
    # is skipped and would otherwise skip this job.
    if: >-
      !cancelled()
      && needs.test.result == 'success'
      && needs.build.result == 'success'
      && needs.examples.result == 'success'
      && (needs.release-please.outputs.release_created == 'true'
          || (github.event_name == 'release' && github.event.action == 'published'))

    steps:
      - uses: actions/checkout@v4
        with:
          # The tagged commit, not the pushed one: a later push's run can create
          # the release for an earlier merge.
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        run: ./mvnw -B -Prelease -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
